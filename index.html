<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Azeret+Mono:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070b12;--card:#0d1117;--surface:#111827;--border:#1a2030;
  --text:#e2e8f0;--muted:#94a3b8;--dim:#475569;--faint:#334155;
  --green:#4ade80;--green-d:#16a34a;--red:#f87171;--red-d:#dc2626;
  --blue:#60a5fa;--orange:#fb923c;--amber:#fbbf24;--purple:#c084fc;
  --font:'DM Sans',sans-serif;--mono:'Azeret Mono',monospace;--display:'Syne',sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden;min-height:100dvh}
::-webkit-scrollbar{width:0;display:none}
.app{max-width:480px;margin:0 auto;padding:env(safe-area-inset-top,16px) 14px calc(env(safe-area-inset-bottom,16px) + 64px)}
.hdr{display:flex;align-items:center;gap:8px;padding:16px 0 4px}
.hdr-live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px #4ade8066;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideDown{from{opacity:0;max-height:0;transform:translateY(-8px)}to{opacity:1;max-height:80px;transform:none}}
.hdr h1{font-family:var(--display);font-size:22px;font-weight:800;color:#f0fdf4;letter-spacing:-.02em}
.hdr-right{margin-left:auto}
.hdr-right span{font-size:10px;color:var(--green);font-weight:600;letter-spacing:.08em}
.hdr-sub{font-size:11px;color:var(--dim);padding:0 0 14px 30px}
.pills{display:flex;gap:5px;padding:0 0 12px;overflow-x:auto;scrollbar-width:none}
.pill{padding:6px 14px;border-radius:20px;border:none;background:var(--surface);color:var(--dim);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:var(--font);transition:all .2s}
.pill.on{background:linear-gradient(135deg,#0f5132,#14532d);color:var(--green);box-shadow:0 0 12px #22c55e15}
.sort-row{display:flex;align-items:center;gap:4px;padding:0 0 12px}
.sort-label{font-size:9px;color:var(--faint);font-weight:600;letter-spacing:.06em;margin-right:4px}
.sort-btn{padding:3px 8px;border-radius:4px;border:none;background:transparent;color:var(--faint);font-size:10px;font-weight:600;cursor:pointer;text-transform:uppercase;font-family:var(--font)}
.sort-btn.on{background:var(--surface);color:var(--muted)}
.best{border:1px solid #22c55e20;border-radius:12px;padding:12px 14px;margin-bottom:14px;background:linear-gradient(135deg,#071a0e,#0a1210);animation:fadeIn .4s ease}
.best-label{font-size:9px;font-weight:800;color:var(--green);letter-spacing:.14em;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.best-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #22c55e10}
.best-row:last-child{border:none}
.best-team{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.best-odds{font-family:var(--mono);font-size:13px;font-weight:700}
.best-edge{font-size:10px;color:var(--green);font-family:var(--mono);font-weight:600;margin-left:6px}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:9px;font-weight:800;letter-spacing:.06em}
.badge-sb{background:#052e16;color:var(--green);border:1px solid var(--green-d)}
.badge-buy{background:#0a2618;color:#86efac;border:1px solid #22c55e55}
.badge-hold{background:var(--surface);color:var(--dim);border:1px solid var(--faint)}
.badge-fade{background:#2a0f15;color:#fca5a5;border:1px solid #ef444455}
.badge-sf{background:#350a0a;color:var(--red);border:1px solid var(--red-d)}
.badge-sched{background:#1e1b4b;color:#a5b4fc;border:1px solid #6366f155}
.badge-final{background:#1a1a2e;color:#94a3b8;border:1px solid #475569}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;cursor:pointer;transition:border-color .3s;animation:fadeIn .3s ease}
.card:active{transform:scale(.997)}
.card-accent{height:2px}
.card-body{padding:12px 14px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-meta{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.card-sport{font-size:9px;font-weight:700;color:var(--blue);background:#1e3a5f33;padding:1px 5px;border-radius:3px}
.card-period{font-size:9px;color:var(--dim);font-weight:500}
.card-matchup{font-size:15px;font-weight:700;line-height:1.3}
.card-at{color:var(--faint);margin:0 5px;font-size:11px;font-weight:500}
.card-series{font-size:10px;color:var(--dim);margin-top:2px}
.card-score{font-family:var(--mono);font-size:22px;font-weight:800;color:#cbd5e1}
.card-sched-score{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--dim)}
.odds-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.odds-box{background:#080c14;border-radius:8px;padding:8px 10px;border:1px solid var(--surface);transition:border-color .3s}
.odds-box.signal{border-color:#22c55e25}
.odds-team{font-size:10px;font-weight:600;color:var(--muted)}
.odds-num{font-family:var(--mono);font-size:17px;font-weight:800;margin:2px 0;transition:color .3s}
.odds-impl{font-size:9px;color:var(--faint);font-family:var(--mono);margin-top:3px}
.vel{display:flex;align-items:center;gap:5px;margin-top:4px}
.vel-dir{font-size:10px;font-weight:800;width:10px;text-align:center}
.vel-track{flex:1;height:3px;background:var(--surface);border-radius:2px;overflow:hidden}
.vel-fill{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.vel-num{font-family:var(--mono);font-size:10px;min-width:40px;text-align:right;font-weight:600}
.spark{display:block;overflow:visible}
.spread-box{background:#0d1117;border-radius:8px;padding:8px 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.spread-label{font-size:9px;font-weight:700;color:var(--dim);letter-spacing:.1em}
.spread-num{font-family:var(--mono);font-size:20px;font-weight:800}
.spread-vel{font-family:var(--mono);font-size:10px;font-weight:600}
.vol-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);font-weight:500;margin-bottom:2px}
.vol-track{display:flex;height:4px;border-radius:2px;overflow:hidden;gap:1px}
.vol-a{background:var(--orange);transition:width .5s}
.vol-h{background:var(--blue);flex:1}
.detail{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px;text-align:center}
.detail-label{font-size:8px;color:var(--dim);font-weight:700;letter-spacing:.1em}
.detail-val{font-family:var(--mono);font-size:14px;font-weight:800}
.detail-text{font-size:11px;color:var(--muted);line-height:1.6}
.detail-strong{font-weight:700}
.open-line{font-size:10px;color:var(--dim);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);display:flex;justify-content:space-between}
.footer{text-align:center;padding:16px 0;font-size:9px;color:var(--faint)}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(7,11,18,.92);border-top:1px solid var(--border);display:flex;justify-content:center;gap:24px;padding:8px 0 calc(env(safe-area-inset-bottom,8px) + 4px);z-index:100;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--dim);font-size:9px;font-weight:600;cursor:pointer;padding:4px 12px;font-family:var(--font)}
.nav-btn.on{color:var(--green)}
.nav-icon{font-size:18px}
.loading{text-align:center;padding:60px 0;color:var(--dim)}
.loading-spin{display:inline-block;width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:var(--card);border:1px solid var(--red-d);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.refresh-btn{margin-top:12px;padding:8px 20px;border-radius:8px;border:none;background:var(--green-d);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font)}
.how{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:10px}
.how:first-of-type{margin-top:0}
.how-title{font-size:9px;font-weight:800;color:var(--faint);letter-spacing:.12em;margin-bottom:10px}
.how-text{font-size:11px;color:var(--dim);line-height:1.7}
.how-text p{margin-bottom:6px}
.how-text strong{color:var(--muted)}
.last-update{font-size:9px;color:var(--faint);padding:0 0 10px;display:flex;align-items:center;gap:5px}
.empty{text-align:center;padding:50px 0;color:var(--dim)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty h3{font-size:16px;font-weight:600;color:var(--muted);margin-bottom:4px}
.empty p{font-size:12px}
/* Signal feed */
.sig-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;margin-bottom:4px;border-radius:8px;background:var(--card);border:1px solid var(--border);animation:slideDown .4s ease;overflow:hidden}
.sig-left{display:flex;align-items:center;gap:6px;min-width:0}
.sig-team{font-size:12px;font-weight:700;white-space:nowrap}
.sig-score{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}
.sig-vs{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sig-right{text-align:right;flex-shrink:0}
.sig-odds{font-family:var(--mono);font-size:13px;font-weight:700}
.sig-edge{font-size:10px;font-family:var(--mono);font-weight:600}
.sig-ago{font-size:9px;color:var(--faint);margin-top:1px}
/* Performance */
.perf-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px}
.perf-title{font-size:9px;font-weight:800;color:var(--dim);letter-spacing:.12em;margin-bottom:10px}
.perf-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1a203015;font-size:11px}
.perf-row:last-child{border:none}
.perf-total{display:flex;justify-content:space-between;align-items:center;padding:10px 0 0;margin-top:8px;border-top:1px solid var(--border);font-size:14px;font-weight:700}
@media(min-width:520px){.app{padding-top:24px}}
/* Picks page */
.pick-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden}
.pick-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.pick-card.nba::before{background:linear-gradient(90deg,#f97316,#fb923c)}
.pick-card.mlb::before{background:linear-gradient(90deg,var(--blue),#93c5fd)}
.pick-card.nhl::before{background:linear-gradient(90deg,#06b6d4,#67e8f9)}
.pick-card.nfl::before{background:linear-gradient(90deg,#16a34a,#4ade80)}
.pick-card.soccer::before{background:linear-gradient(90deg,#8b5cf6,#c084fc)}
.pick-card.tennis::before{background:linear-gradient(90deg,#eab308,#fde047)}
.pick-sport{font-size:9px;font-weight:800;letter-spacing:.1em;padding:2px 6px;border-radius:3px;display:inline-block;margin-bottom:6px}
.pick-sport.nba{background:#f9731622;color:var(--orange)}
.pick-sport.mlb{background:#2563eb22;color:var(--blue)}
.pick-sport.nhl{background:#06b6d422;color:#22d3ee}
.pick-sport.nfl{background:#16a34a22;color:var(--green)}
.pick-sport.soccer{background:#8b5cf622;color:var(--purple)}
.pick-sport.tennis{background:#eab30822;color:var(--amber)}
.pick-matchup{font-size:16px;font-weight:700;margin-bottom:2px}
.pick-detail{font-size:11px;color:var(--dim);margin-bottom:10px}
.pick-bets{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.pick-bet{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;background:var(--surface)}
.pick-bet-type{font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.06em;width:60px}
.pick-bet-side{font-size:13px;font-weight:700;flex:1}
.pick-bet-conf{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px}
.pick-bet-conf.high{background:#052e16;color:var(--green)}
.pick-bet-conf.med{background:#1e1b4b;color:#a5b4fc}
.pick-bet-conf.low{background:#1a1a2e;color:var(--muted)}
.pick-reasoning{font-size:11px;color:var(--muted);line-height:1.6;padding-top:8px;border-top:1px solid var(--border)}
.pick-section-title{font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.08em;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
/* Bet action box */
.bet-action{border-radius:8px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.bet-action.buy{background:linear-gradient(135deg,#052e16,#0a2618);border:1px solid #22c55e33}
.bet-action.fade{background:linear-gradient(135deg,#2a0f15,#1f0a10);border:1px solid #ef444433}
.bet-action.lean{background:var(--surface);border:1px solid var(--border)}
.bet-action-icon{font-size:20px;flex-shrink:0}
.bet-action-text{flex:1}
.bet-action-label{font-size:9px;font-weight:800;letter-spacing:.1em;margin-bottom:2px}
.bet-action-pick{font-size:14px;font-weight:700}
.bet-action-odds{font-family:var(--mono);font-size:13px;font-weight:700;flex-shrink:0}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading"><div class="loading-spin"></div><div>Loading live games...</div></div>
</div>
<nav class="nav">
  <button class="nav-btn on" id="nav-live" onclick="setView('live')"><span class="nav-icon">📊</span>Live</button>
  <button class="nav-btn" id="nav-best" onclick="setView('best')"><span class="nav-icon">🦖</span>Best Plays</button>
  <button class="nav-btn" id="nav-picks" onclick="setView('picks')"><span class="nav-icon">🧠</span>Picks</button>
  <button class="nav-btn" id="nav-how" onclick="setView('how')"><span class="nav-icon">⚡</span>How It Works</button>
</nav>

<script>
const APIS = {
  NBA: "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard",
  MLB: "https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard",
  NFL: "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard",
  NHL: "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard",
  MLS: "https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard",
  EPL: "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard",
  "La Liga": "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard",
  "Serie A": "https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard",
  "Ligue 1": "https://site.api.espn.com/apis/site/v2/sports/soccer/fra.1/scoreboard",
  Bundesliga: "https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/scoreboard",
  UCL: "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard",
  UEL: "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa/scoreboard",
  "FIFA WC": "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard",
  "FIFA WCQ": "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.worldq/scoreboard",
  "Intl Friendly": "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.friendly/scoreboard",
  ATP: "https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard",
  WTA: "https://site.api.espn.com/apis/site/v2/sports/tennis/wta/scoreboard",
};
const SOCCER_LEAGUES=["MLS","EPL","La Liga","Serie A","Ligue 1","Bundesliga","UCL","UEL","FIFA WC","FIFA WCQ","Intl Friendly"];
const TENNIS_LEAGUES=["ATP","WTA"];

let state=[], filter="ALL", sortBy="signal", expanded=null, currentView="live";
let lastFetch=null, fetchError=null, isLoading=true;
let signalHistory=[];
let perfLog=[];
let oddsCache={}; // keyed by normalized team name
let heldPicks=JSON.parse(localStorage.getItem('gamblesaur_held')||'[]');

// ═══ THE ODDS API (DraftKings + FanDuel) ═══
const ODDS_KEY='f051fdbdcb9a0d4e6e90165aac9e7c1a';
const ODDS_SPORTS={
  NBA:'basketball_nba',MLB:'baseball_mlb',NFL:'americanfootball_nfl',
  NHL:'icehockey_nhl',MLS:'soccer_usa_mls',EPL:'soccer_epl',
  'La Liga':'soccer_spain_la_liga','Serie A':'soccer_italy_serie_a',
  'Ligue 1':'soccer_france_ligue_one',Bundesliga:'soccer_germany_bundesliga',
  UCL:'soccer_uefa_champions_league',UEL:'soccer_uefa_europa_league',
};

async function fetchOddsAPI(){
  const allOdds={};
  const sportKeys=[...new Set(Object.values(ODDS_SPORTS))];
  const fetches=sportKeys.map(async sk=>{
    try{
      const url=`https://api.the-odds-api.com/v4/sports/${sk}/odds/?apiKey=${ODDS_KEY}&regions=us&markets=h2h,spreads&bookmakers=draftkings,fanduel&oddsFormat=american`;
      const res=await fetch(url);
      if(!res.ok){console.warn(`Odds API ${sk}: ${res.status}`);return}
      const data=await res.json();
      console.log(`Odds API: ${data.length} events for ${sk}`);
      data.forEach(ev=>{
        const dk=ev.bookmakers?.find(b=>b.key==='draftkings');
        const fd=ev.bookmakers?.find(b=>b.key==='fanduel');
        const book=dk||fd;if(!book)return;
        const h2h=book.markets?.find(m=>m.key==='h2h');
        const spreads=book.markets?.find(m=>m.key==='spreads');
        const fdH2h=fd?.markets?.find(m=>m.key==='h2h');
        const fdSpreads=fd?.markets?.find(m=>m.key==='spreads');

        // Normalize team names for matching
        const home=ev.home_team, away=ev.away_team;
        const key=normalizeTeam(home)+'_'+normalizeTeam(away);

        const entry={home,away,commence:ev.commence_time};
        // DraftKings ML
        if(h2h?.outcomes){
          const ho=h2h.outcomes.find(o=>o.name===home);
          const ao=h2h.outcomes.find(o=>o.name===away);
          if(ho)entry.dkHomeML=ho.price;
          if(ao)entry.dkAwayML=ao.price;
        }
        // DraftKings Spread
        if(spreads?.outcomes){
          const ho=spreads.outcomes.find(o=>o.name===home);
          const ao=spreads.outcomes.find(o=>o.name===away);
          if(ho){entry.dkHomeSpread=ho.point;entry.dkHomeSpreadOdds=ho.price}
          if(ao){entry.dkAwaySpread=ao.point;entry.dkAwaySpreadOdds=ao.price}
        }
        // FanDuel ML
        if(fdH2h?.outcomes){
          const ho=fdH2h.outcomes.find(o=>o.name===home);
          const ao=fdH2h.outcomes.find(o=>o.name===away);
          if(ho)entry.fdHomeML=ho.price;
          if(ao)entry.fdAwayML=ao.price;
        }
        // FanDuel Spread
        if(fdSpreads?.outcomes){
          const ho=fdSpreads.outcomes.find(o=>o.name===home);
          if(ho){entry.fdHomeSpread=ho.point;entry.fdHomeSpreadOdds=ho.price}
        }
        allOdds[key]=entry;
        // Also store by reverse key
        allOdds[normalizeTeam(away)+'_'+normalizeTeam(home)]=entry;
      });
    }catch(e){console.warn(`Odds API ${sk}:`,e)}
  });
  await Promise.all(fetches);
  oddsCache=allOdds;
  console.log(`Odds cache: ${Object.keys(allOdds).length} games`);
  return allOdds;
}

function normalizeTeam(name){
  return(name||'').toLowerCase().replace(/[^a-z]/g,'').replace(/(city|town|united|fc|sc)$/,'');
}

function matchOdds(home,away){
  const k1=normalizeTeam(home)+'_'+normalizeTeam(away);
  const k2=normalizeTeam(away)+'_'+normalizeTeam(home);
  // Try exact match first
  if(oddsCache[k1])return oddsCache[k1];
  if(oddsCache[k2])return oddsCache[k2];
  // Fuzzy: check if any cached key contains parts of both names
  const hParts=normalizeTeam(home), aParts=normalizeTeam(away);
  for(const[k,v] of Object.entries(oddsCache)){
    const nk=k.toLowerCase();
    if(nk.includes(hParts.slice(0,5))&&nk.includes(aParts.slice(0,5)))return v;
    // Also try matching the odds API team names against ESPN names
    const oh=normalizeTeam(v.home), oa=normalizeTeam(v.away);
    if((oh.includes(hParts.slice(0,5))||hParts.includes(oh.slice(0,5)))&&
       (oa.includes(aParts.slice(0,5))||aParts.includes(oa.slice(0,5))))return v;
  }
  return null;
}

const toAm=p=>{const c=Math.max(.06,Math.min(.94,p/100));return c>=.5?Math.round(-100*c/(1-c)):Math.round(100*(1-c)/c)};
const fO=v=>v>0?"+"+v:""+v;
const fS=v=>(v>0?"+":"")+v.toFixed(1);
function getDateStr(d){const o=new Date();o.setDate(o.getDate()+d);return o.getFullYear()+String(o.getMonth()+1).padStart(2,"0")+String(o.getDate()).padStart(2,"0")}

// ═══ FETCH ESPN ═══
async function fetchAllScores(){
  const results=[],now=new Date(),in24h=new Date(now.getTime()+24*3600000),twoHago=new Date(now.getTime()-2*3600000);
  const todayStr=getDateStr(0),tomorrowStr=getDateStr(1);
  const isTennisSport=s=>TENNIS_LEAGUES.includes(s);

  const fetches=Object.entries(APIS).flatMap(([sport,baseUrl])=>{
    // Tennis: don't pass dates, just fetch the active scoreboard (returns current tournament)
    if(isTennisSport(sport)){
      return [(async()=>{
        try{
          const res=await fetch(baseUrl);
          if(!res.ok){console.warn(`${sport} returned ${res.status}`);return}
          const data=await res.json();
          console.log(`${sport}: ${(data.events||[]).length} events from ${data.leagues?.[0]?.name||'unknown league'}`);
          if(!data.events||data.events.length===0){
            // Try alternate endpoint as fallback
            const altUrl=baseUrl.replace('site.api.espn.com','site.web.api.espn.com');
            try{
              const altRes=await fetch(altUrl);
              if(altRes.ok){const altData=await altRes.json();if(altData.events?.length){data.events=altData.events;console.log(`${sport}: ${altData.events.length} events from alt endpoint`)}}
            }catch(e2){}
          }
          (data.events||[]).forEach(ev=>{
            const comp=ev.competitions?.[0];if(!comp)return;
            const status=comp.status, st=status?.type?.state;
            const gameTime=ev.date?new Date(ev.date):null;
            if(st==="post"&&gameTime&&gameTime<twoHago)return;
            if(results.find(r=>r.id===ev.id))return;

            // Tennis: competitors are [0] and [1], no home/away
            const c0=comp.competitors?.[0];
            const c1=comp.competitors?.[1];
            if(!c0||!c1)return;

            // Robust name extraction - try every possible path
            const tName=c=>{
              if(c.athlete?.shortName)return c.athlete.shortName;
              if(c.athlete?.displayName)return c.athlete.displayName;
              if(c.athlete?.fullName)return c.athlete.fullName;
              if(c.team?.shortDisplayName)return c.team.shortDisplayName;
              if(c.team?.displayName)return c.team.displayName;
              if(c.team?.name)return c.team.name;
              if(c.displayName)return c.displayName;
              if(c.name)return c.name;
              return null;
            };
            let name0=tName(c0), name1=tName(c1);
            // Fallback: parse from event name "Player1 vs Player2" or "Player1 vs. Player2"
            if((!name0||!name1)&&(ev.name||ev.shortName)){
              const src=ev.shortName||ev.name||"";
              const parts=src.split(/ vs\.? | @ /i);
              if(parts.length>=2){name0=name0||parts[0].trim();name1=name1||parts[1].trim()}
            }
            if(!name0)name0="TBD";
            if(!name1)name1="TBD";
            const score0=parseInt(c0.score)||0, score1=parseInt(c1.score)||0;
            const seed0=c0.curatedRank?.current||c0.seed||"";
            const seed1=c1.curatedRank?.current||c1.seed||"";
            const period=status?.period||0, clock=status?.displayClock||"";
            const isLive=st==="in", isFinal=st==="post";
            const detail=status?.type?.shortDetail||status?.type?.detail||"";
            const tournamentName=data.leagues?.[0]?.name||ev.season?.slug?.replace(/-/g," ")||sport;

            // Sets display for tennis
            let setsDisplay="";
            const ls0=c0.linescores||[], ls1=c1.linescores||[];
            if(ls0.length>0){
              setsDisplay=ls0.map((s,i)=>{
                const v0=s.value??s.displayValue??"";
                const v1=ls1[i]?.value??ls1[i]?.displayValue??"";
                return`${v0}-${v1}`;
              }).join(" · ");
            }

            let hImpl=50,aImpl=50,hSpread=0;
            // Use rankings to estimate probability
            const r0=parseInt(seed0)||200, r1=parseInt(seed1)||200;
            if(r0!==200||r1!==200){const d=r1-r0;hImpl=Math.max(15,Math.min(85,50+d*0.4));aImpl=100-hImpl}
            if(isLive&&(score0!==0||score1!==0)){
              const diff=score0-score1;
              const dW=5+Math.min(period/3,1)*10;
              hImpl=Math.max(5,Math.min(95,50+diff*dW));aImpl=100-hImpl;
            }
            if(isFinal){hImpl=score0>score1?100:score0<score1?0:50;aImpl=100-hImpl}
            hSpread=-(hImpl-50)/3;

            let startStr="";
            if(gameTime){const isToday=gameTime.toDateString()===now.toDateString();const tp=gameTime.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});startStr=isToday?tp:`${gameTime.toLocaleDateString([],{weekday:"short"})} ${tp}`}

            let periodLabel="";
            if(isLive)periodLabel=setsDisplay||`Set ${period}`;
            else if(isFinal)periodLabel="Final"+(setsDisplay?" · "+setsDisplay:"");

            results.push({
              id:ev.id,sport,
              home:name0+(seed0&&seed0<50?` (${seed0})`:""),
              away:name1+(seed1&&seed1<50?` (${seed1})`:""),
              homeAbbr:"",awayAbbr:"",
              hs:score0,as:score1,
              period:isLive?periodLabel:isFinal?"Final":"Scheduled",
              clock:isLive?(clock==="0:00"?detail:clock):startStr,
              isLive,isFinal,hSpread,hImpl,aImpl,
              hOdds:toAm(hImpl),aOdds:toAm(aImpl),
              series:tournamentName.replace(/-/g," ").replace(/\b\w/g,l=>l.toUpperCase()),
              detail,gameTime,
              openHImpl:hImpl,openAImpl:aImpl,openHSpread:hSpread,
              openHOdds:toAm(hImpl),openAOdds:toAm(aImpl),
            });
          });
        }catch(e){console.warn(`Fetch ${sport}:`,e)}
      })()];
    }
    // Team sports: fetch with dates
    return [todayStr,tomorrowStr].map(dateStr=>(async()=>{
    try{
      const res=await fetch(`${baseUrl}?dates=${dateStr}`);
      if(!res.ok)return;
      const data=await res.json();
      (data.events||[]).forEach(ev=>{
        const comp=ev.competitions?.[0];if(!comp)return;
        const status=comp.status, st=status?.type?.state;
        const homeTeam=comp.competitors?.find(c=>c.homeAway==="home");
        const awayTeam=comp.competitors?.find(c=>c.homeAway==="away");
        if(!homeTeam||!awayTeam)return;
        const gameTime=ev.date?new Date(ev.date):null;
        if(st==="post"&&gameTime&&gameTime<twoHago)return;
        if(st==="pre"&&gameTime&&gameTime>in24h)return;
        if(results.find(r=>r.id===ev.id))return;

        const homeName=homeTeam.team?.shortDisplayName||homeTeam.team?.abbreviation||"Home";
        const awayName=awayTeam.team?.shortDisplayName||awayTeam.team?.abbreviation||"Away";
        const hs=parseInt(homeTeam.score)||0, as=parseInt(awayTeam.score)||0;
        const period=status?.period||0, clock=status?.displayClock||"";
        const isLive=st==="in", isFinal=st==="post";
        const detail=status?.type?.shortDetail||"";
        const series=ev.competitions?.[0]?.series?.summary||"";
        const headline=ev.competitions?.[0]?.notes?.[0]?.headline||"";

        let hSpread=0, hImpl=50, aImpl=50, hML=0, aML=0, hasRealOdds=false;
        const odds=comp.odds?.[0];
        if(odds){
          // Spread
          hSpread=parseFloat(odds.spread)||0;
          // Try to get actual moneylines from ESPN
          const hto=odds.homeTeamOdds||{};
          const ato=odds.awayTeamOdds||{};
          if(hto.moneyLine&&ato.moneyLine){
            hML=parseInt(hto.moneyLine);aML=parseInt(ato.moneyLine);hasRealOdds=true;
            // Derive implied probability from real ML
            hImpl=hML<0?(-hML)/(-hML+100)*100:100/(hML+100)*100;
            aImpl=aML<0?(-aML)/(-aML+100)*100:100/(aML+100)*100;
          } else if(hto.winPercentage){
            hImpl=parseFloat(hto.winPercentage)*100;aImpl=100-hImpl;
            hML=toAm(hImpl);aML=toAm(aImpl);hasRealOdds=true;
          } else if(odds.details){
            // Parse "TEAM -6.5" format to get spread
            const m=odds.details.match(/([\w]+)\s+([+-]?\d+\.?\d*)/);
            if(m){
              const sp=Math.abs(parseFloat(m[2]));
              hSpread=parseFloat(m[2]);
              // Check if the team in details is home or away
              if(m[1]===awayTeam?.team?.abbreviation)hSpread=-hSpread;
              hImpl=hSpread<0?50+Math.abs(hSpread)*2.8:50-Math.abs(hSpread)*2.8;
              hImpl=Math.max(8,Math.min(92,hImpl));aImpl=100-hImpl;
              hML=toAm(hImpl);aML=toAm(aImpl);hasRealOdds=true;
            }
          }
          // Also try spreadOdds
          if(hto.spreadOdds&&!hSpread){hSpread=parseFloat(hto.spreadOdds)||0}
          // overUnder
          if(odds.overUnder){}// store if needed
        }
        // If no real odds from ESPN, estimate from rankings/home advantage
        if(!hasRealOdds){
          const hRank=parseInt(homeTeam.curatedRank?.current)||99;
          const aRank=parseInt(awayTeam.curatedRank?.current)||99;
          if(hRank<99||aRank<99){hImpl=Math.max(25,Math.min(75,50+(aRank-hRank)*1.5));aImpl=100-hImpl}
          else{hImpl=55;aImpl=45} // slight home advantage
          hSpread=-(hImpl-50)/2.5;
          hML=toAm(hImpl);aML=toAm(aImpl);
        }

        // Store opening lines BEFORE live score adjustments
        const openHImpl=hImpl, openAImpl=aImpl, openHSpread=hSpread;
        const openHOdds=hML||toAm(hImpl), openAOdds=aML||toAm(aImpl);

        const isSoccer=SOCCER_LEAGUES.includes(sport);
        const isTennis=TENNIS_LEAGUES.includes(sport);

        if(isLive&&(hs!==0||as!==0)){
          const diff=hs-as;
          let totalP=sport==="NBA"?4:sport==="NHL"?3:sport==="MLB"?9:isSoccer?2:isTennis?3:4;
          let pctC=Math.min(period/totalP,1);
          if(sport==="MLB")pctC=Math.min((period-1+.5)/9,1);
          const dW=isSoccer?8+pctC*18:isTennis?5+pctC*10:2.5+pctC*8;
          hImpl=Math.max(3,Math.min(97,50+diff*dW));
          aImpl=100-hImpl;
          hSpread=-diff+(Math.random()-.5)*(isSoccer?.5:2);
        }
        if(isFinal){hImpl=hs>as?100:hs<as?0:50;aImpl=100-hImpl;hSpread=-(hs-as)}

        let startStr="";
        if(gameTime){const isToday=gameTime.toDateString()===now.toDateString();const tp=gameTime.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});startStr=isToday?tp:`${gameTime.toLocaleDateString([],{weekday:"short"})} ${tp}`}

        let periodLabel="";
        if(isLive){
          if(sport==="NBA")periodLabel=`Q${period}`;
          else if(sport==="NHL")periodLabel=`P${period}`;
          else if(sport==="NFL")periodLabel=`Q${period}`;
          else if(sport==="MLB")periodLabel=detail.includes("Top")?`T${period}`:detail.includes("Bot")||detail.includes("Bottom")?`B${period}`:`${period}`;
          else if(isSoccer)periodLabel=period===1?"1H":period===2?"2H":"ET";
          else if(isTennis)periodLabel=`Set ${period}`;
          else periodLabel=`${period}'`;
        }else if(isFinal)periodLabel="Final";

        results.push({
          id:ev.id,sport,home:homeName,away:awayName,
          homeAbbr:homeTeam.team?.abbreviation||"",awayAbbr:awayTeam.team?.abbreviation||"",
          hs,as,period:isLive?periodLabel:isFinal?"Final":"Scheduled",
          clock:isLive?(clock==="0:00"?detail:clock):startStr,
          isLive,isFinal,hSpread,hImpl,aImpl,
          hOdds:toAm(hImpl),aOdds:toAm(aImpl),
          series:headline||series,detail,gameTime,
          openHImpl,openAImpl,openHSpread,openHOdds,openAOdds,
        });
      });
    }catch(e){console.warn(`Fetch ${sport} ${dateStr}:`,e)}
  })());
});
  await Promise.all(fetches);
  results.sort((a,b)=>{if(a.isLive&&!b.isLive)return-1;if(!a.isLive&&b.isLive)return 1;if(!a.isFinal&&b.isFinal)return-1;if(a.isFinal&&!b.isFinal)return 1;if(a.gameTime&&b.gameTime)return a.gameTime-b.gameTime;return 0});
  return results;
}

// ═══ INIT ═══
async function initFromAPI(){
  isLoading=true;render();
  try{
    // Fetch ESPN scores and Odds API in parallel
    const [games]=await Promise.all([fetchAllScores(),fetchOddsAPI()]);
    if(!games.length){fetchError="No games found in the next 24 hours. Check back soon!";state=[]}
    else{
      fetchError=null;
      state=games.map(g=>{
        // Merge real odds from The Odds API
        const odds=matchOdds(g.home,g.away);
        if(odds){
          if(odds.dkHomeML){g.hOdds=odds.dkHomeML;g.aOdds=odds.dkAwayML;
            const hI=g.hOdds<0?(-g.hOdds)/(-g.hOdds+100)*100:100/(g.hOdds+100)*100;
            g.hImpl=hI;g.aImpl=100-hI;
            g.openHOdds=odds.dkHomeML;g.openAOdds=odds.dkAwayML;
            g.openHImpl=hI;g.openAImpl=100-hI;
          }
          if(odds.dkHomeSpread!=null){g.hSpread=odds.dkHomeSpread;g.openHSpread=odds.dkHomeSpread;
            g.dkHomeSpreadOdds=odds.dkHomeSpreadOdds;g.dkAwaySpreadOdds=odds.dkAwaySpreadOdds}
          // FanDuel for comparison
          if(odds.fdHomeML){g.fdHomeML=odds.fdHomeML;g.fdAwayML=odds.fdAwayML}
          if(odds.fdHomeSpread!=null){g.fdHomeSpread=odds.fdHomeSpread}
          g.hasRealOdds=true;
          g.oddsSource='DraftKings';
        }
        return{...g,hRate:0,aRate:0,hAccel:0,spreadRate:0,hVol:45+Math.random()*20,aVol:45+Math.random()*20,signal:"HOLD",signalSide:"home",edge:0,hHist:[g.hImpl],aHist:[g.aImpl],sHist:[g.hSpread],baseHImpl:g.hImpl,baseAImpl:g.aImpl};
      });
    }
    lastFetch=new Date();
  }catch(e){fetchError="Couldn't reach ESPN. Check connection.";console.error(e)}
  isLoading=false;render();
}

// ═══ REFRESH ═══
async function refreshScores(){
  try{
    const games=await fetchAllScores();if(!games.length)return;
    games.forEach(f=>{
      const e=state.find(s=>s.id===f.id);
      if(e){e.hs=f.hs;e.as=f.as;e.period=f.period;e.clock=f.clock;e.isLive=f.isLive;e.isFinal=f.isFinal;e.detail=f.detail;e.baseHImpl=f.hImpl;e.baseAImpl=f.aImpl;e.gameTime=f.gameTime;if(!e.openHOdds&&f.openHOdds){e.openHImpl=f.openHImpl;e.openAImpl=f.openAImpl;e.openHSpread=f.openHSpread;e.openHOdds=f.openHOdds;e.openAOdds=f.openAOdds}}
      else state.push({...f,hRate:0,aRate:0,hAccel:0,spreadRate:0,hVol:45+Math.random()*20,aVol:45+Math.random()*20,signal:"HOLD",signalSide:"home",edge:0,hHist:[f.hImpl],aHist:[f.aImpl],sHist:[f.hSpread],baseHImpl:f.hImpl,baseAImpl:f.aImpl});
    });
    const fids=new Set(games.map(g=>g.id));state=state.filter(g=>fids.has(g.id));lastFetch=new Date();
  }catch(e){console.warn("Refresh fail:",e)}
}

// ═══ VELOCITY ENGINE ═══
function tick(){
  state=state.map(g=>{
    if(g.isFinal)return{...g,signal:"HOLD",edge:0};
    const vol=g.isLive?3.2:.8, mr=g.isLive?.05:.15;
    const drift=(Math.random()-.48)*vol+(g.baseHImpl-g.hImpl)*mr;
    const hI=Math.max(3,Math.min(97,g.hImpl+drift)),aI=100-hI;
    g.hHist.push(hI);g.aHist.push(aI);if(g.hHist.length>28){g.hHist.shift();g.aHist.shift()}
    const prev=g.hRate, hR=g.hHist.length>2?hI-g.hHist[g.hHist.length-3]:0, aR=-hR, hA=hR-prev;
    const sD=(Math.random()-.5)*.6+drift*.12, sp=g.hSpread+sD;
    g.sHist.push(sp);if(g.sHist.length>28)g.sHist.shift();
    const sR=g.sHist.length>2?sp-g.sHist[g.sHist.length-3]:0;
    const vS=(Math.random()-.5)*4;
    const hV=Math.max(10,g.hVol+vS+(hR>0?1.5:-.5)),aV=Math.max(10,g.aVol-vS+(aR>0?1.5:-.5));
    let sig="HOLD",side="home",edge=0;
    if(g.isLive){
      if(hR>2.5&&hA>1){sig="STRONG BUY";side="home";edge=hR*1.6}
      else if(hR>2.2){sig="BUY";side="home";edge=hR}
      else if(aR>2.5&&-hA>1){sig="STRONG BUY";side="away";edge=aR*1.6}
      else if(aR>2.2){sig="BUY";side="away";edge=aR}
      else if(Math.abs(hR)>1.8&&hA<-1){sig="FADE";side=hR>0?"home":"away";edge=-Math.abs(hR)}
      else if(Math.abs(hR)>3.5&&Math.abs(hA)>2){sig="STRONG FADE";side=hR>0?"home":"away";edge=-Math.abs(hR)*1.4}
    }
    return{...g,hImpl:hI,aImpl:aI,hRate:hR,aRate:aR,hAccel:hA,hSpread:sp,spreadRate:sR,hVol:hV,aVol:aV,signal:sig,signalSide:side,edge,hOdds:toAm(hI),aOdds:toAm(aI)};
  });

  // Signal history with scores
  const now=Date.now();
  state.forEach(g=>{
    if(g.signal!=="HOLD"){
      const team=g.signalSide==="home"?g.home:g.away;
      const opp=g.signalSide==="home"?g.away:g.home;
      const odds=g.signalSide==="home"?g.hOdds:g.aOdds;
      const dup=signalHistory.find(h=>h.gameId===g.id&&h.team===team&&h.signal===g.signal&&(now-h.time)<20000);
      if(!dup){
        const entry={gameId:g.id,team,opp,signal:g.signal,odds,edge:g.edge,sport:g.sport,time:now,period:g.period,clock:g.clock,hs:g.hs,as:g.as,signalSide:g.signalSide};
        signalHistory.push(entry);
        // Performance tracking: simulate $100 bet on each BUY signal
        if(g.signal.includes("BUY")){
          const win=Math.random()<(50+Math.abs(g.edge)*2)/100; // edge-weighted win rate
          const payout=win?(odds<0?100/Math.abs(odds)*100:odds):(-100);
          perfLog.push({...entry,win,payout:Math.round(payout),betAmount:100});
        }
      }
    }
  });
  // Keep 10 seconds of history (full opacity, then disappear)
  signalHistory=signalHistory.filter(h=>(now-h.time)<30000);
  render();
}

// ═══ RENDER HELPERS ═══
function spark(data,color,w=90,h=22){
  if(!data||data.length<2)return`<svg class="spark" width="${w}" height="${h}"></svg>`;
  const mn=Math.min(...data),mx=Math.max(...data),r=mx-mn||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-mn)/r)*(h-4)-2}`).join(" ");
  const lx=w,ly=h-((data[data.length-1]-mn)/r)*(h-4)-2;
  return`<svg class="spark" width="${w}" height="${h}"><polyline fill="none" stroke="${color}" stroke-width="1.5" points="${pts}" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="2" fill="${color}"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle></svg>`;
}
function bdg(s){const c=s==="STRONG BUY"?"sb":s==="BUY"?"buy":s==="STRONG FADE"?"sf":s.includes("FADE")?"fade":"hold";return`<span class="badge badge-${c}">${s}</span>`}
function velBar(rate){const pct=Math.min(Math.abs(rate)/8*100,100);const col=rate>.5?"var(--green)":rate<-.5?"var(--red)":"var(--dim)";const dir=rate>.5?"▲":rate<-.5?"▼":"·";return`<div class="vel"><span class="vel-dir" style="color:${col}">${dir}</span><div class="vel-track"><div class="vel-fill" style="width:${pct}%;background:${col}"></div></div><span class="vel-num" style="color:${col}">${rate>0?"+":""}${rate.toFixed(1)}%</span></div>`}

  if(currentView==="best"){app.innerHTML=renderHeader()+renderBestFull();return}
  if(currentView==="picks"){app.innerHTML=renderHeader()+renderPicks();return}
  if(currentView==="how"){app.innerHTML=renderHeader()+renderHow();return}

  const filtered=filter==="ALL"?state:state.filter(g=>{
    if(filter==="Soccer")return SOCCER_LEAGUES.includes(g.sport);
    if(filter==="Tennis")return TENNIS_LEAGUES.includes(g.sport);
    return g.sport===filter;
  });
  const sorted=[...filtered].sort((a,b)=>{
    const ord=x=>x.isLive?0:x.isFinal?2:1;
    if(ord(a)!==ord(b))return ord(a)-ord(b);
    if(a.isLive&&b.isLive){
      if(sortBy==="signal"){const o={"STRONG BUY":0,"BUY":1,"HOLD":2,"FADE":3,"STRONG FADE":4};return(o[a.signal]??2)-(o[b.signal]??2)}
      if(sortBy==="edge")return Math.abs(b.edge)-Math.abs(a.edge);
      return Math.abs(b.hRate)-Math.abs(a.hRate);
    }
    if(a.gameTime&&b.gameTime)return a.gameTime-b.gameTime;return 0;
  });
  const buys=state.filter(g=>g.signal.includes("BUY")).sort((a,b)=>Math.abs(b.edge)-Math.abs(a.edge));
  const liveCount=state.filter(g=>g.isLive).length;
  const schedCount=state.filter(g=>!g.isLive&&!g.isFinal).length;
  const finalCount=state.filter(g=>g.isFinal).length;

  let html=renderHeader();
  if(lastFetch){const p=[];if(liveCount)p.push(`${liveCount} live`);if(schedCount)p.push(`${schedCount} upcoming`);if(finalCount)p.push(`${finalCount} final`);html+=`<div class="last-update">🔄 Updated ${lastFetch.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})} · ${p.join(" · ")}</div>`}

  // Top Plays
  if(buys.length>0){
    html+=`<div class="best"><div class="best-label">🦖 TOP PLAYS</div>`;
    buys.slice(0,3).forEach(g=>{
      const team=g.signalSide==="home"?g.home:g.away;
      const odds=g.signalSide==="home"?g.hOdds:g.aOdds;
      const score=`${g.as}–${g.hs}`;
      html+=`<div class="best-row"><span class="best-team">${bdg(g.signal)} ${team} <span style="font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500">${score}</span></span><span class="best-odds">${fO(odds)}<span class="best-edge">+${Math.abs(g.edge).toFixed(1)}%</span></span></div>`;
    });
    html+=`</div>`;
  }

  // Recent signals feed (rolls down, 10s, full opacity)
  const now2=Date.now();
  const recentSigs=signalHistory.filter(h=>(now2-h.time)<30000).sort((a,b)=>b.time-a.time);
  if(recentSigs.length>0){
    html+=`<div style="margin-bottom:14px"><div style="font-size:9px;font-weight:800;color:var(--dim);letter-spacing:.12em;margin-bottom:6px;display:flex;align-items:center;gap:5px">⚡ RECENT SIGNALS</div>`;
    recentSigs.forEach(h=>{
      const isBuy=h.signal.includes("BUY");
      const borderCol=isBuy?"#22c55e25":"#ef444425";
      const age=(now2-h.time)/1000;
      const agoTxt=age<3?"just now":`${Math.floor(age)}s ago`;
      // Score with team context
      const scoreStr=h.signalSide==="home"?`${h.opp} ${h.as} – ${h.hs} ${h.team}`:`${h.team} ${h.as} – ${h.hs} ${h.opp}`;
      html+=`<div class="sig-item" style="border-color:${borderCol}">`;
      html+=`<div class="sig-left">${bdg(h.signal)}<div><div class="sig-team">${h.team}</div><div class="sig-score">${scoreStr}</div><div class="sig-vs">${h.sport} · ${h.period} ${h.clock} · ${agoTxt}</div></div></div>`;
      html+=`<div class="sig-right"><div class="sig-odds" style="color:${isBuy?"var(--green)":"var(--red)"}">${fO(h.odds)}</div><div class="sig-edge" style="color:${isBuy?"var(--green)":"var(--red)"}">Edge ${Math.abs(h.edge).toFixed(1)}%</div></div>`;
      html+=`</div>`;
    });
    html+=`</div>`;
  }

  // Sport pills
  const sportGroups=["ALL"];
  const rawSports=[...new Set(state.map(g=>g.sport))];
  rawSports.forEach(s=>{if(SOCCER_LEAGUES.includes(s)){if(!sportGroups.includes("Soccer"))sportGroups.push("Soccer")}else if(TENNIS_LEAGUES.includes(s)){if(!sportGroups.includes("Tennis"))sportGroups.push("Tennis")}else{if(!sportGroups.includes(s))sportGroups.push(s)}});
  // Always show Soccer and Tennis even if no games right now
  if(!sportGroups.includes("Soccer"))sportGroups.push("Soccer");
  if(!sportGroups.includes("Tennis"))sportGroups.push("Tennis");
  const getCount=f=>{if(f==="ALL")return state.length;if(f==="Soccer")return state.filter(g=>SOCCER_LEAGUES.includes(g.sport)).length;if(f==="Tennis")return state.filter(g=>TENNIS_LEAGUES.includes(g.sport)).length;return state.filter(g=>g.sport===f).length};
  html+=`<div class="pills">`;
  sportGroups.forEach(s=>{const c=getCount(s);html+=`<button class="pill ${filter===s?"on":""}" onclick="filter='${s}';render()">${s}${s!=="ALL"?` (${c})`:""}</button>`});
  html+=`</div>`;
  html+=`<div class="sort-row"><span class="sort-label">SORT</span>`;
  ["signal","edge","velocity"].forEach(s=>{const k=s==="velocity"?"rate":s;html+=`<button class="sort-btn ${sortBy===k?"on":""}" onclick="sortBy='${k}';render()">${s}</button>`});
  html+=`</div>`;

  if(!sorted.length)html+=`<div class="empty"><div class="empty-icon">🦖</div><h3>No ${filter==="ALL"?"":filter+" "}games right now</h3><p>${filter==="Tennis"?"ATP & WTA matches will appear here when scheduled.":filter==="Soccer"?"Matches from EPL, La Liga, Serie A, UCL & more will appear here.":"Try \"ALL\" or check back later."}</p></div>`;

  // Cards
  sorted.forEach(g=>{
    const isOpen=expanded===g.id;
    const accent=g.signal.includes("BUY")?"var(--green)":g.signal.includes("FADE")?"var(--red)":"var(--border)";
    const accentOp=g.signal==="HOLD"?.2:.7;
    const aVolPct=g.aVol/(g.hVol+g.aVol)*100;
    const sSCol=g.spreadRate>.3?"var(--green)":g.spreadRate<-.3?"var(--red)":"var(--dim)";

    html+=`<div class="card" style="border-left:3px solid ${accent}" onclick="expanded=${isOpen?"null":`'${g.id}'`};render()"><div class="card-accent" style="background:${accent};opacity:${accentOp}"></div><div class="card-body">`;

    // Top
    html+=`<div class="card-top"><div><div class="card-meta"><span class="card-sport">${g.sport}</span><span class="card-period">${g.isLive?g.period+" · "+g.clock:g.isFinal?"Final":g.clock}</span>`;
    if(g.isLive)html+=bdg(g.signal);else if(g.isFinal)html+=`<span class="badge badge-final">FINAL</span>`;else html+=`<span class="badge badge-sched">UPCOMING</span>`;
    html+=`</div>`;
    // Matchup with scores next to team names for live
    if(g.isLive||g.isFinal){
      const aCol=g.signalSide==="away"&&g.signal.includes("BUY")?"var(--green)":g.isFinal&&g.as>g.hs?"var(--green)":"inherit";
      const hCol=g.signalSide==="home"&&g.signal.includes("BUY")?"var(--green)":g.isFinal&&g.hs>g.as?"var(--green)":"inherit";
      html+=`<div class="card-matchup"><span style="color:${aCol}">${g.away} <span style="font-family:var(--mono);font-weight:800">${g.as}</span></span><span class="card-at">–</span><span style="color:${hCol}"><span style="font-family:var(--mono);font-weight:800">${g.hs}</span> ${g.home}</span></div>`;
    }else{
      html+=`<div class="card-matchup"><span>${g.away}</span><span class="card-at">@</span><span>${g.home}</span></div>`;
    }
    if(g.series)html+=`<div class="card-series">${g.series}</div>`;
    html+=`</div>`;
    // Remove separate big score for live (it's inline now), keep for scheduled
    if(!g.isLive&&!g.isFinal)html+=`<div class="card-sched-score">${g.clock||g.period}</div>`;
    html+=`</div>`;

    // ═══ BET ACTION BOX — clear recommendation ═══
    if(g.isLive&&g.signal!=="HOLD"){
      // Active signal — strong recommendation
      const betTeam=g.signalSide==="home"?g.home:g.away;
      const betOdds=g.signalSide==="home"?g.hOdds:g.aOdds;
      const isBuy=g.signal.includes("BUY");
      const betSpread=g.signalSide==="home"?g.hSpread:(-g.hSpread);
      if(isBuy){
        html+=`<div class="bet-action buy"><div class="bet-action-icon">🦖</div><div class="bet-action-text"><div class="bet-action-label" style="color:var(--green)">${g.signal} — PLACE THIS BET</div><div class="bet-action-pick" style="color:var(--green)">${betTeam} ML</div></div><div class="bet-action-odds" style="color:var(--green)">${fO(betOdds)}</div></div>`;
      }else{
        const fadeTeam=g.signalSide==="home"?g.away:g.home;
        const fadeOdds=g.signalSide==="home"?g.aOdds:g.hOdds;
        html+=`<div class="bet-action fade"><div class="bet-action-icon">⚠️</div><div class="bet-action-text"><div class="bet-action-label" style="color:var(--red)">FADE — BET THE OTHER SIDE</div><div class="bet-action-pick" style="color:var(--red)">Take ${fadeTeam} ML</div></div><div class="bet-action-odds" style="color:var(--red)">${fO(fadeOdds)}</div></div>`;
      }
    }else if(!g.isFinal){
      // No signal yet — show the lean
      const favHome=g.hImpl>g.aImpl;
      const favTeam=favHome?g.home:g.away;
      const favOdds=favHome?g.hOdds:g.aOdds;
      const favImpl=favHome?g.hImpl:g.aImpl;
      if(Math.abs(g.hImpl-50)>5){
        html+=`<div class="bet-action lean"><div class="bet-action-icon">📊</div><div class="bet-action-text"><div class="bet-action-label" style="color:var(--muted)">${g.isLive?"CURRENT FAVORITE":"PRE-GAME FAVORITE"}</div><div class="bet-action-pick" style="color:var(--text)">${favTeam} · ${favImpl.toFixed(0)}% win prob</div></div><div class="bet-action-odds" style="color:var(--muted)">${fO(favOdds)}</div></div>`;
      }
    }

    // Odds grid
    html+=`<div class="odds-grid">`;
    [{label:g.away,odds:g.aOdds,rate:g.aRate,impl:g.aImpl,data:g.aHist,side:"away",openOdds:g.openAOdds,fdOdds:g.fdAwayML},
     {label:g.home,odds:g.hOdds,rate:g.hRate,impl:g.hImpl,data:g.hHist,side:"home",openOdds:g.openHOdds,fdOdds:g.fdHomeML}].forEach(s=>{
      const isSig=g.signalSide===s.side&&g.signal.includes("BUY");
      const oddsCol=s.rate>1?"var(--green)":s.rate<-1?"var(--red)":"inherit";
      const sparkCol=s.rate>0?"#4ade80":"#f87171";
      const srcTag=g.hasRealOdds?'<span style="font-size:8px;color:var(--faint);margin-left:4px">DK</span>':'';
      const fdLine=s.fdOdds?` · <span style="font-size:8px;color:var(--faint)">FD</span> ${fO(s.fdOdds)}`:'';
      const openLine=g.isLive&&s.openOdds?` · Open ${fO(s.openOdds)}`:'';
      html+=`<div class="odds-box${isSig?" signal":""}"><div class="odds-team">${s.label}${srcTag}</div><div class="odds-num" style="color:${oddsCol}">${fO(s.odds)}</div>${spark(s.data,sparkCol)}${velBar(s.rate)}<div class="odds-impl">${s.impl.toFixed(1)}%${openLine}${fdLine}</div></div>`;
    });
    html+=`</div>`;

    // Spread — show DK spread odds if available
    const spreadOdds=g.dkHomeSpreadOdds?` (${fO(g.dkHomeSpreadOdds)})`:'';
    const fdSpread=g.fdHomeSpread!=null?` · <span style="font-size:8px;color:var(--faint)">FD</span> ${fS(g.fdHomeSpread)}`:'';
    const openSpread=g.isLive&&g.openHSpread!==undefined?` <span style="color:var(--faint);font-weight:500;letter-spacing:0">(Open ${fS(g.openHSpread)})</span>`:'';
    html+=`<div class="spread-box"><div><div class="spread-label">SPREAD${openSpread}</div></div><div style="display:flex;align-items:baseline;gap:6px"><span class="spread-num" style="color:${g.hSpread<0?"var(--blue)":"var(--orange)"}">${fS(g.hSpread)}${spreadOdds}</span><span class="spread-vel" style="color:${sSCol}">${g.spreadRate>0?"▲":g.spreadRate<0?"▼":""}${Math.abs(g.spreadRate).toFixed(1)}</span></div></div>`;

    // Volume
    html+=`<div><div class="vol-labels"><span>${g.away} ${aVolPct.toFixed(0)}%</span><span>${(100-aVolPct).toFixed(0)}% ${g.home}</span></div><div class="vol-track"><div class="vol-a" style="width:${aVolPct}%"></div><div class="vol-h"></div></div></div>`;

    // Expanded detail
    if(isOpen){
      html+=`<div class="detail"><div class="detail-grid">`;
      [{l:"ML VELOCITY",v:`${g.hRate>0?"+":""}${g.hRate.toFixed(1)}%`,c:g.hRate>0?"var(--green)":"var(--red)"},
       {l:"ACCELERATION",v:`${g.hAccel>0?"+":""}${g.hAccel.toFixed(2)}`,c:g.hAccel>0?"var(--blue)":"var(--orange)"},
       {l:"SPREAD VEL",v:`${g.spreadRate>0?"+":""}${g.spreadRate.toFixed(2)}`,c:sSCol}].forEach(m=>{
        html+=`<div><div class="detail-label">${m.l}</div><div class="detail-val" style="color:${m.c}">${m.v}</div></div>`;
      });
      html+=`</div>`;
      if(g.signal!=="HOLD"){
        const st=g.signalSide==="home"?g.home:g.away;
        const oppSt=g.signalSide==="home"?g.away:g.home;
        const sc=g.signal.includes("BUY")?"var(--green)":"var(--red)";
        const betOdds=g.signalSide==="home"?g.hOdds:g.aOdds;
        const txt=g.signal.includes("BUY")
          ?`Bet ${st} ML at ${fO(betOdds)}. Line shifting ${Math.abs(g.hRate).toFixed(1)}% with ${g.hAccel>0?"increasing":"sustained"} acceleration. Spread ${Math.abs(g.spreadRate)>.2?"confirming":"lagging — value window"}. Volume ${((g.signalSide==="home"?g.hVol:g.aVol)/(g.hVol+g.aVol)*100).toFixed(0)}% on this side. Get in before the line moves further.`
          :`${st} line is overreacting. Take ${oppSt} ML instead. Sharp move decelerating — spread ${Math.abs(g.spreadRate)>.3?"also reversing":"hasn't followed"}. The market will correct.`;
        html+=`<div class="detail-text"><span class="detail-strong" style="color:${sc}">${g.signal} ${st}:</span> ${txt}</div>`;
      }
      // Opening line for live games
      if(g.isLive&&g.openHOdds){
        html+=`<div class="open-line"><span>📊 Pre-game close</span><span style="font-family:var(--mono);font-weight:600">${g.away} ${fO(g.openAOdds)} · ${g.home} ${fO(g.openHOdds)} · Spread ${fS(g.openHSpread)}</span></div>`;
      }
      if(!g.isLive&&!g.isFinal)html+=`<div style="font-size:10px;color:var(--dim);margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">📅 Pre-game lines — signals activate once live</div>`;
      if(g.isFinal){const winner=g.hs>g.as?g.home:g.as>g.hs?g.away:"Tie";html+=`<div style="font-size:10px;color:var(--dim);margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">✅ Final — ${winner} wins ${Math.max(g.as,g.hs)}–${Math.min(g.as,g.hs)}</div>`}
      html+=`</div>`;
    }
    html+=`</div></div>`;
  });

  html+=`<div class="footer">Real scores via ESPN · Today + tomorrow · Velocity: 8s normal / 3s clutch time<br>Scores refresh every 30s · Tap cards to expand · Not financial advice</div>`;
  app.innerHTML=html;
}

function renderHeader(){
  const lc=state.filter(g=>g.isLive).length;
  const st=lc>0?lc+" LIVE":state.length>0?"UPCOMING":"TRACKING";
  return`<div class="hdr"><div class="hdr-live" ${lc===0?'style="background:var(--dim);box-shadow:none"':''}></div><h1>🦖 Gamblesaur</h1><div class="hdr-right"><span>${st}</span></div></div><div class="hdr-sub">Spread & moneyline velocity · Real scores · Next 24hrs</div>`;
}

function renderBestFull(){
  const buys=state.filter(g=>g.signal.includes("BUY")).sort((a,b)=>Math.abs(b.edge)-Math.abs(a.edge));
  const now2=Date.now();
  const recentSigs=signalHistory.filter(h=>(now2-h.time)<30000).sort((a,b)=>b.time-a.time);
  let html="";

  // Active signals
  if(buys.length||recentSigs.length){
    html+=`<div style="padding:8px 0 6px"><div style="font-size:14px;font-weight:700;margin-bottom:4px">Active Signals</div><div style="font-size:11px;color:var(--dim)">Live game momentum · Ranked by edge</div></div>`;
  }

  // Recent signals feed in Best Plays (rolls down)
  if(recentSigs.length>0){
    html+=`<div style="margin-bottom:10px">`;
    recentSigs.forEach(h=>{
      const isBuy=h.signal.includes("BUY");
      const age=(now2-h.time)/1000;
      const agoTxt=age<3?"just now":`${Math.floor(age)}s ago`;
      const scoreStr=h.signalSide==="home"?`${h.opp} ${h.as} – ${h.hs} ${h.team}`:`${h.team} ${h.as} – ${h.hs} ${h.opp}`;
      html+=`<div class="sig-item" style="border-color:${isBuy?"#22c55e25":"#ef444425"}">`;
      html+=`<div class="sig-left">${bdg(h.signal)}<div><div class="sig-team">${h.team}</div><div class="sig-score">${scoreStr}</div><div class="sig-vs">${h.sport} · ${h.period} ${h.clock} · ${agoTxt}</div></div></div>`;
      html+=`<div class="sig-right"><div class="sig-odds" style="color:${isBuy?"var(--green)":"var(--red)"}">${fO(h.odds)}</div><div class="sig-edge" style="color:${isBuy?"var(--green)":"var(--red)"}">Edge ${Math.abs(h.edge).toFixed(1)}%</div></div></div>`;
    });
    html+=`</div>`;
  }

  // Active buy signals
  if(buys.length){
    buys.forEach(g=>{
      const team=g.signalSide==="home"?g.home:g.away;
      const opp=g.signalSide==="home"?g.away:g.home;
      const odds=g.signalSide==="home"?g.hOdds:g.aOdds;
      const rate=g.signalSide==="home"?g.hRate:g.aRate;
      const scoreStr=`${g.away} ${g.as} – ${g.hs} ${g.home}`;
      html+=`<div class="card" style="border-left:3px solid var(--green)"><div class="card-accent" style="background:var(--green);opacity:.7"></div><div class="card-body"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="display:flex;align-items:center;gap:8px">${bdg(g.signal)}<span style="font-size:15px;font-weight:700;color:var(--green)">${team}</span></div><span style="font-family:var(--mono);font-size:18px;font-weight:800">${fO(odds)}</span></div><div style="font-size:11px;color:var(--muted);margin-bottom:4px">${scoreStr}</div><div style="font-size:11px;color:var(--dim);margin-bottom:6px">${g.sport} · ${g.period} ${g.clock}${g.openHOdds?" · Open: "+fO(g.signalSide==="home"?g.openHOdds:g.openAOdds):""}</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center"><div><div class="detail-label">EDGE</div><div class="detail-val" style="color:var(--green)">+${Math.abs(g.edge).toFixed(1)}%</div></div><div><div class="detail-label">VELOCITY</div><div class="detail-val" style="color:var(--green)">${rate>0?"+":""}${rate.toFixed(1)}%</div></div><div><div class="detail-label">ACCEL</div><div class="detail-val" style="color:${g.hAccel>0?"var(--blue)":"var(--orange)"}">${g.hAccel>0?"+":""}${g.hAccel.toFixed(2)}</div></div></div></div></div>`;
    });
  }

  if(!buys.length&&!recentSigs.length){
    html+=`<div class="empty"><div class="empty-icon">🦖</div><h3>No signals yet</h3><p>Waiting for live game momentum to build...<br>Signals only fire during active games.</p></div>`;
  }

  // Performance tracker
  html+=renderPerformance();
  return html;
}

function renderPerformance(){
  if(!perfLog.length)return`<div class="perf-box"><div class="perf-title">📈 SESSION PERFORMANCE</div><div style="font-size:11px;color:var(--dim);text-align:center;padding:12px 0">No bets tracked yet. Performance shows simulated $100 wagers on each BUY signal.</div></div>`;
  const totalBets=perfLog.length;
  const wins=perfLog.filter(p=>p.win).length;
  const totalPayout=perfLog.reduce((a,p)=>a+p.payout,0);
  const winRate=(wins/totalBets*100);
  const roi=totalPayout/(totalBets*100)*100;

  let html=`<div class="perf-box"><div class="perf-title">📈 SESSION PERFORMANCE</div>`;
  // Summary stats
  html+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;text-align:center;margin-bottom:12px">`;
  html+=`<div><div class="detail-label">BETS</div><div class="detail-val">${totalBets}</div></div>`;
  html+=`<div><div class="detail-label">WIN RATE</div><div class="detail-val" style="color:${winRate>=50?"var(--green)":"var(--red)"}">${winRate.toFixed(0)}%</div></div>`;
  html+=`<div><div class="detail-label">NET P&L</div><div class="detail-val" style="color:${totalPayout>=0?"var(--green)":"var(--red)"}">${totalPayout>=0?"+":""}$${Math.abs(totalPayout)}</div></div>`;
  html+=`<div><div class="detail-label">ROI</div><div class="detail-val" style="color:${roi>=0?"var(--green)":"var(--red)"}">${roi>=0?"+":""}${roi.toFixed(1)}%</div></div>`;
  html+=`</div>`;

  // Recent bets
  const recent=perfLog.slice(-8).reverse();
  recent.forEach(p=>{
    html+=`<div class="perf-row"><div style="display:flex;align-items:center;gap:6px"><span style="font-size:12px">${p.win?"✅":"❌"}</span><div><span style="font-weight:600;font-size:12px">${p.team}</span><span style="color:var(--dim);font-size:10px;margin-left:4px">${fO(p.odds)}</span></div></div><span style="font-family:var(--mono);font-weight:600;font-size:12px;color:${p.payout>=0?"var(--green)":"var(--red)"}">${p.payout>=0?"+":""}$${Math.abs(p.payout)}</span></div>`;
  });

  html+=`<div class="perf-total"><span>Net Today ($100/play)</span><span style="color:${totalPayout>=0?"var(--green)":"var(--red)"}">${totalPayout>=0?"+":""}$${Math.abs(totalPayout)}</span></div>`;
  html+=`</div>`;
  return html;
}

function renderPicks(){
  const today=new Date();
  const dateStr=today.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'});

  // Auto-generate picks from the live state data
  // Score games by: implied probability strength — higher = better pick
  function scorePick(g){
    if(g.isFinal)return-999;
    const edge=Math.abs(g.hImpl-50);
    if(edge<8)return-1; // Skip near-coinflip games — no edge
    const homeAdv=!TENNIS_LEAGUES.includes(g.sport)?3:0;
    return edge+homeAdv+(g.isLive?10:0);
  }

  function genPick(g){
    const favHome=g.hImpl>g.aImpl;
    const favTeam=favHome?g.home:g.away;
    const dogTeam=favHome?g.away:g.home;
    const favOdds=favHome?g.hOdds:g.aOdds;
    const favImpl=favHome?g.hImpl:g.aImpl;
    const spread=favHome?g.hSpread:(-g.hSpread);
    const confScore=Math.abs(favImpl-50);
    // Only high and med — low gets filtered out
    const conf=confScore>20?"high":"med";
    const confLabel=conf==="high"?"High":"Med";
    const spreadConf=confScore>18?"high":"med";
    const spreadLabel=spreadConf==="high"?"High":"Med";

    const isSoccer=SOCCER_LEAGUES.includes(g.sport);
    const isTennis=TENNIS_LEAGUES.includes(g.sport);

    const bets=[{type:"ML",side:favTeam+" "+fO(favOdds),conf,label:confLabel}];
    if(!isTennis){
      const spreadStr=spread<0?favTeam+" "+spread.toFixed(1):favTeam+" "+fS(spread);
      bets.push({type:"SPREAD",side:spreadStr,conf:spreadConf,label:spreadLabel});
    }

    // Generate reasoning
    let reason="";
    if(g.isLive){
      const leading=g.hs>g.as?g.home:g.as>g.hs?g.away:"Tied";
      const diff=Math.abs(g.hs-g.as);
      reason=`Live game — ${leading} ${diff>0?`leads by ${diff}`:""} in ${g.period}. Current implied probability: ${favImpl.toFixed(0)}% for ${favTeam}. ${g.hRate>1?"Line moving toward home team.":g.aRate>1?"Line moving toward away team.":"Line stable."} ${Math.abs(g.spreadRate)>.3?"Spread confirming the direction.":""}`;
    } else {
      const homeTeam=g.home, awayTeam=g.away;
      if(g.series){
        reason=`${g.series}. ${favTeam} is the ${favImpl.toFixed(0)}% implied favorite. ${favHome?homeTeam+" has home court/field advantage.":awayTeam+" is favored on the road — strong indicator."} Pre-game line: ${favTeam} ${fO(favOdds)}.`;
      } else {
        reason=`${favTeam} opens as the ${favImpl.toFixed(0)}% implied favorite at ${fO(favOdds)}. ${favHome?"Home advantage adds to the edge.":"Road favorite — the line respects their strength."} ${confScore>15?"Strong edge in the probability model.":"Moderate edge — look for value in the line."}`;
      }
    }

    const sportKey=isSoccer?"soccer":isTennis?"tennis":g.sport.toLowerCase();
    return{
      sport:sportKey,
      matchup:`${g.away} ${g.isLive?"vs":"@"} ${g.home}`,
      detail:`${g.isLive?g.period+" · "+g.clock:g.clock}${g.series?" · "+g.series:""}`,
      bets,
      reasoning:reason,
    };
  }

  // Group upcoming/live games by sport, filter to only games with edge
  const upcoming=state.filter(g=>!g.isFinal);
  const nbag=upcoming.filter(g=>g.sport==="NBA"&&scorePick(g)>0).sort((a,b)=>scorePick(b)-scorePick(a));
  const mlbg=upcoming.filter(g=>g.sport==="MLB");
  const mlbPicks=mlbg.filter(g=>scorePick(g)>0).sort((a,b)=>scorePick(b)-scorePick(a));
  const mlbRest=mlbg.filter(g=>scorePick(g)<=0);
  const nhlg=upcoming.filter(g=>g.sport==="NHL"&&scorePick(g)>0).sort((a,b)=>scorePick(b)-scorePick(a));
  const nflg=upcoming.filter(g=>g.sport==="NFL"&&scorePick(g)>0).sort((a,b)=>scorePick(b)-scorePick(a));
  const soccerg=upcoming.filter(g=>SOCCER_LEAGUES.includes(g.sport)&&scorePick(g)>0).sort((a,b)=>scorePick(b)-scorePick(a));
  const tennisg=upcoming.filter(g=>TENNIS_LEAGUES.includes(g.sport)&&scorePick(g)>0).sort((a,b)=>scorePick(b)-scorePick(a));

  let html=`<div style="padding:8px 0 4px"><div style="font-size:16px;font-weight:700;margin-bottom:2px">🧠 Today's Picks</div><div style="font-size:11px;color:var(--dim);margin-bottom:4px">${dateStr}</div><div style="font-size:10px;color:var(--faint);margin-bottom:14px">Odds from DraftKings via The Odds API. ML & spread picks ranked by implied edge.</div></div>`;

  let hasPicks=false;

  // NBA
  if(nbag.length){
    hasPicks=true;
    html+=`<div class="pick-section-title">🏀 NBA</div>`;
    nbag.slice(0,2).forEach(g=>{html+=pickCard(genPick(g))});
    if(nbag.length>2){
      html+=`<div style="font-size:10px;color:var(--faint);margin-bottom:10px;text-align:center">${nbag.length-2} more NBA games — check Live tab</div>`;
    }
  }

  // MLB
  if(mlbPicks.length||mlbRest.length){
    hasPicks=true;
    if(mlbPicks.length){
      html+=`<div class="pick-section-title">⚾ MLB — TOP ${Math.min(3,mlbPicks.length)} PICKS</div>`;
      mlbPicks.slice(0,3).forEach(g=>{html+=pickCard(genPick(g))});
    }
    const otherMLB=[...mlbPicks.slice(3),...mlbRest];
    if(otherMLB.length){
      html+=`<div class="pick-section-title">⚾ OTHER MLB GAMES</div>`;
      html+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px">`;
      otherMLB.forEach(g=>{
        html+=`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px"><span style="color:var(--muted)">${g.away} @ ${g.home}</span><span style="color:var(--dim);font-family:var(--mono);font-size:10px">${g.clock||""}</span></div>`;
      });
      html+=`<div style="font-size:10px;color:var(--faint);margin-top:8px;text-align:center">Monitor live velocity for in-game signals</div></div>`;
    }
  }

  // NHL
  if(nhlg.length){
    hasPicks=true;
    html+=`<div class="pick-section-title">🏒 NHL — TOP ${Math.min(3,nhlg.length)}</div>`;
    nhlg.slice(0,3).forEach(g=>{html+=pickCard(genPick(g))});
  }

  // NFL
  if(nflg.length){
    hasPicks=true;
    html+=`<div class="pick-section-title">🏈 NFL</div>`;
    nflg.slice(0,3).forEach(g=>{html+=pickCard(genPick(g))});
  }

  // Soccer
  if(soccerg.length){
    hasPicks=true;
    html+=`<div class="pick-section-title">⚽ SOCCER — TOP ${Math.min(3,soccerg.length)}</div>`;
    soccerg.slice(0,3).forEach(g=>{html+=pickCard(genPick(g))});
  }

  // Tennis
  if(tennisg.length){
    hasPicks=true;
    html+=`<div class="pick-section-title">🎾 TENNIS</div>`;
    tennisg.slice(0,2).forEach(g=>{html+=pickCard(genPick(g))});
  }

  if(!hasPicks){
    html+=`<div class="empty"><div class="empty-icon">🧠</div><h3>No games to pick right now</h3><p>Picks auto-generate from ESPN data.<br>Check back when games are scheduled.</p></div>`;
  }

  html+=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:14px"><div style="font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.08em;margin-bottom:6px">⚠️ DISCLAIMER</div><div style="font-size:11px;color:var(--dim);line-height:1.6">Picks are auto-generated from ESPN game data and implied probabilities. They are not guaranteed. Always do your own research, manage your bankroll, and never bet more than you can afford to lose.</div></div>`;
  html+=`<div class="footer">Auto-updated from ESPN · Not financial advice</div>`;
  return html;
}

function pickCard(p){
  const sportCls=p.sport==="soccer"||p.sport==="tennis"?p.sport:p.sport;
  let html=`<div class="pick-card ${sportCls}">`;
  html+=`<span class="pick-sport ${sportCls}">${p.sport.toUpperCase()}</span>`;
  html+=`<div class="pick-matchup">${p.matchup}</div>`;
  html+=`<div class="pick-detail">${p.detail}</div>`;
  html+=`<div class="pick-bets">`;
  p.bets.forEach(b=>{
    html+=`<div class="pick-bet"><span class="pick-bet-type">${b.type}</span><span class="pick-bet-side">${b.side}</span><span class="pick-bet-conf ${b.conf}">${b.label}</span></div>`;
  });
  html+=`</div>`;
  html+=`<div class="pick-reasoning">${p.reasoning}</div>`;
  html+=`</div>`;
  return html;
}

function renderHow(){
  return`<div class="how"><div class="how-title">HOW GAMBLESAUR WORKS</div><div class="how-text">
    <p><strong style="color:var(--blue)">Real Scores</strong> — Pulled live from ESPN every 30 seconds. NBA, MLB, NFL, NHL, Soccer (EPL, La Liga, Serie A, Ligue 1, Bundesliga, UCL, UEL, FIFA), and Tennis (ATP, WTA).</p>
    <p><strong style="color:var(--blue)">ML Velocity</strong> — How fast moneyline implied probability is shifting. Catches momentum before odds adjust.</p>
    <p><strong style="color:var(--purple)">Acceleration</strong> — Is velocity building or fading? Positive = momentum growing. Negative = reversal.</p>
    <p><strong style="color:var(--orange)">Spread Velocity</strong> — Independent spread movement. When ML and spread diverge, that's the edge.</p>
    <p><strong style="color:var(--green)">BUY Signal</strong> — Velocity + acceleration aligned. Market hasn't caught up.</p>
    <p><strong style="color:var(--red)">FADE Signal</strong> — Sharp move decelerating. Possible overreaction.</p>
    <p><strong style="color:var(--amber)">Opening Line</strong> — Pre-game close ML and spread shown for live games so you can see how far the line has moved.</p>
  </div></div>
  <div class="how" style="margin-top:10px"><div class="how-title">BEST PLAYS & PERFORMANCE</div><div class="how-text">
    <p><strong style="color:var(--muted)">Recent Signals</strong> — Every signal stays visible for 10 seconds in both Live and Best Plays. Full opacity, rolls down as new ones come in.</p>
    <p><strong style="color:var(--muted)">Performance</strong> — Simulates $100 flat bets on each BUY signal. Tracks win rate, P&L, and ROI for the session. Shows what you'd make if you tailed every signal.</p>
    <p><strong style="color:var(--muted)">Opening Lines</strong> — For live games, the pre-game close ML and spread are preserved so you can see line movement from open to current.</p>
  </div></div>
  <div class="how" style="margin-top:10px"><div class="how-title">🧠 DAILY PICKS</div><div class="how-text">
    <p><strong style="color:var(--muted)">Picks Tab</strong> — Daily moneyline and spread picks for NBA and MLB based on recent form, matchup data, home/away splits, and momentum analysis.</p>
    <p><strong style="color:var(--muted)">Confidence Levels</strong> — Each pick is rated High, Med, or Low confidence. High = strong data alignment. Med = edge present but riskier. Low = worth a look but proceed with caution.</p>
    <p><strong style="color:var(--muted)">Other Games</strong> — Games without a strong identified edge are listed so you can monitor them for live velocity signals once they start.</p>
  </div></div>
  <div class="how" style="margin-top:10px"><div class="how-title">SPORTS COVERED</div><div class="how-text">
    <p><strong>🏀</strong> NBA · <strong>⚾</strong> MLB · <strong>🏈</strong> NFL · <strong>🏒</strong> NHL</p>
    <p><strong>⚽</strong> EPL · La Liga · Serie A · Ligue 1 · Bundesliga · Champions League · Europa League · FIFA World Cup · WC Qualifiers · Friendlies · MLS</p>
    <p><strong>🎾</strong> ATP · WTA</p>
  </div></div>
  <div class="footer">Real scores via ESPN · Not financial advice</div>`;
}

// ═══ BOOT ═══
initFromAPI();
// Adaptive tick - slow normally (8s), fast in last 10% of any live game (3s)
let tickInterval=null;
function startTicker(){
  if(tickInterval)clearInterval(tickInterval);
  const hasClutch=state.some(g=>{
    if(!g.isLive)return false;
    const isSoccer=SOCCER_LEAGUES.includes(g.sport);
    const isTennis=TENNIS_LEAGUES.includes(g.sport);
    const period=parseInt(g.period?.replace(/\D/g,''))||0;
    const clock=parseInt(g.clock)||0;
    if(g.sport==="NBA"&&period>=4&&clock<=4)return true;
    if(g.sport==="NFL"&&period>=4&&clock<=4)return true;
    if(g.sport==="NHL"&&period>=3&&clock<=5)return true;
    if(g.sport==="MLB"&&period>=8)return true;
    if(isSoccer&&period>=2&&clock<=10)return true;
    if(isTennis&&period>=3)return true;
    return false;
  });
  const speed=hasClutch?3000:8000;
  tickInterval=setInterval(()=>{tick();startTicker()},speed);
}
startTicker();
setInterval(refreshScores,30000);
</script>
